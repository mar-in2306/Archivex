# ============================================================
# Archivex - Configuracion de Test (H2 en memoria)
# ============================================================
spring.datasource.url=jdbc:h2:mem:archivex_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

archivex.jwt.secret=archivex-test-secret-key-for-testing-only-minimum-256-bits-long
archivex.jwt.expiration=3600000

archivex.storage.path=target/test-uploads/

spring.mail.host=localhost
spring.mail.port=1025
