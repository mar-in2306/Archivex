# ============================================================
# Archivex - Configuracion de Desarrollo
# ============================================================

# Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/archivex_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=junio2306
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
archivex.jwt.secret=archivex-super-secret-key-2026-development-only-min-256bits
archivex.jwt.expiration=86400000

# Correo (MailHog en local)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Directorio de archivos subidos
archivex.storage.path=uploads/

# Logging detallado en dev
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
